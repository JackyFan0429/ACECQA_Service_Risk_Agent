[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "acecqa-risk-agent"
version = "0.1.0"
description = "Deterministic analytics core for an ACECQA regulatory prioritisation AI agent"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2,<3",
  "pydantic>=2.10,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
