[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "acecqa-risk-agent"
version = "0.6.0"
description = "Productised ACECQA decision-support copilot with deterministic analytics, policy retrieval, scenarios, formal evaluation, FastAPI, and a web demo"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2,<3",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
agent = [
  "openai-agents>=0.16,<1",
]
policy = [
  "requests>=2.32,<3",
  "beautifulsoup4>=4.13,<5",
  "pypdf>=5,<7",
]
product = [
  "openai-agents>=0.16,<1",
  "requests>=2.32,<3",
  "beautifulsoup4>=4.13,<5",
  "pypdf>=5,<7",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
]
dev = [
  "pytest>=8,<10",
  "openai-agents>=0.16,<1",
  "requests>=2.32,<3",
  "beautifulsoup4>=4.13,<5",
  "pypdf>=5,<7",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
