[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "acecqa-risk-agent"
version = "0.5.0"
description = "Evaluated ACECQA decision-support copilot with deterministic analytics, scenarios, grounded policy retrieval, and a formal benchmark harness"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2,<3",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
agent = [
  "openai-agents>=0.16,<1",
]
policy = [
  "requests>=2.32,<3",
  "beautifulsoup4>=4.13,<5",
  "pypdf>=5,<7",
]
dev = [
  "pytest>=8,<10",
  "openai-agents>=0.16,<1",
  "requests>=2.32,<3",
  "beautifulsoup4>=4.13,<5",
  "pypdf>=5,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
